<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-labelledby="exTitle exDesc">
  <title id="exTitle">Explore repositories - interconnected systems</title>
  <desc id="exDesc">Abstract illustration of interconnected repository nodes representing distributed software systems</desc>
  <defs>
    <linearGradient id="exBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="100%" stop-color="#13243A"/>
    </linearGradient>
    <linearGradient id="exNode" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A3352"/>
      <stop offset="100%" stop-color="#0F1C2E"/>
    </linearGradient>
    <radialGradient id="exGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="exSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @media (prefers-reduced-motion: reduce) {
        .anim, .anim * { animation: none !important; }
        .packet { display: none; }
      }
      @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
      .pulse { animation: pulse 5s ease-in-out infinite; }
      .f1 { animation: float 8s ease-in-out infinite; }
      .f2 { animation: float 10s ease-in-out infinite 1s; }
      .f3 { animation: float 9s ease-in-out infinite 2s; }
    </style>
  </defs>

  <rect width="1100" height="320" rx="12" fill="url(#exBg)"/>
  <rect width="1100" height="320" rx="12" fill="url(#exGlow)"/>
  <rect x="1" y="1" width="1098" height="318" rx="11" fill="none" stroke="#1E3A5F" stroke-width="1"/>

  <g opacity="0.1" stroke="#3B82F6" stroke-width="0.6" fill="none">
    <path d="M550 40 L100 300 M550 40 L300 300 M550 40 L500 300 M550 40 L700 300 M550 40 L900 300 M550 40 L1000 300"/>
  </g>

  <g class="anim" fill="none" stroke="#3B82F6" stroke-width="1.1" opacity="0.45">
    <path d="M280 160 C340 120, 400 100, 480 140"/>
    <path d="M280 160 C340 200, 400 220, 480 180"/>
    <path d="M480 140 C540 100, 600 90, 680 130"/>
    <path d="M480 180 C540 220, 600 230, 680 190"/>
    <path d="M680 130 C740 100, 800 110, 860 150"/>
    <path d="M680 190 C740 230, 800 220, 860 170"/>
    <path d="M480 140 C520 160, 520 160, 480 180"/>
    <path d="M680 130 C720 160, 720 160, 680 190"/>
    <path d="M200 100 C240 130, 260 140, 280 160"/>
    <path d="M200 220 C240 190, 260 180, 280 160"/>
    <path d="M860 150 C900 130, 940 110, 980 90"/>
    <path d="M860 170 C900 190, 940 210, 980 230"/>
  </g>

  <g class="anim" filter="url(#exSoft)">
    <circle class="packet" r="2.8" fill="#22D3EE">
      <animateMotion dur="5s" repeatCount="indefinite" path="M280 160 C340 120, 400 100, 480 140"/>
    </circle>
    <circle class="packet" r="2.4" fill="#818CF8">
      <animateMotion dur="6s" repeatCount="indefinite" begin="1s" path="M480 180 C540 220, 600 230, 680 190"/>
    </circle>
    <circle class="packet" r="2.6" fill="#22D3EE">
      <animateMotion dur="5.5s" repeatCount="indefinite" begin="2s" path="M680 130 C740 100, 800 110, 860 150"/>
    </circle>
    <circle class="packet" r="2.2" fill="#3B82F6">
      <animateMotion dur="7s" repeatCount="indefinite" begin="0.5s" path="M200 100 C240 130, 260 140, 280 160"/>
    </circle>
  </g>

  <g class="anim">
    <g class="f1 pulse" transform="translate(245,130)">
      <rect width="70" height="60" rx="8" fill="url(#exNode)" stroke="#22D3EE" stroke-width="1.5"/>
      <rect x="18" y="14" width="34" height="28" rx="3" fill="none" stroke="#22D3EE" stroke-width="1.2" opacity="0.7"/>
      <path d="M28 28 H42 M28 34 H38" stroke="#94A3B8" stroke-width="1" opacity="0.6"/>
      <circle cx="58" cy="12" r="3" fill="#22D3EE"/>
    </g>

    <g class="f2" transform="translate(450,110)">
      <rect width="60" height="52" rx="7" fill="url(#exNode)" stroke="#3B82F6" stroke-width="1.2"/>
      <rect x="14" y="12" width="32" height="24" rx="2" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.7"/>
      <path d="M22 24 H38 M22 30 H34" stroke="#94A3B8" stroke-width="1" opacity="0.5"/>
    </g>

    <g class="f3" transform="translate(450,160)">
      <rect width="60" height="52" rx="7" fill="url(#exNode)" stroke="#818CF8" stroke-width="1.2"/>
      <rect x="14" y="12" width="32" height="24" rx="2" fill="none" stroke="#818CF8" stroke-width="1" opacity="0.7"/>
      <path d="M22 24 H38 M22 30 H34" stroke="#94A3B8" stroke-width="1" opacity="0.5"/>
    </g>

    <g class="f1" transform="translate(650,100)">
      <rect width="60" height="52" rx="7" fill="url(#exNode)" stroke="#22D3EE" stroke-width="1.2"/>
      <rect x="14" y="12" width="32" height="24" rx="2" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.7"/>
      <path d="M22 24 H38 M22 30 H34" stroke="#94A3B8" stroke-width="1" opacity="0.5"/>
    </g>

    <g class="f2 pulse" transform="translate(650,165)">
      <rect width="60" height="52" rx="7" fill="url(#exNode)" stroke="#3B82F6" stroke-width="1.2"/>
      <rect x="14" y="12" width="32" height="24" rx="2" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.7"/>
      <path d="M22 24 H38 M22 30 H34" stroke="#94A3B8" stroke-width="1" opacity="0.5"/>
    </g>

    <g class="f3" transform="translate(830,125)">
      <rect width="70" height="58" rx="8" fill="url(#exNode)" stroke="#818CF8" stroke-width="1.3"/>
      <rect x="18" y="14" width="34" height="26" rx="3" fill="none" stroke="#818CF8" stroke-width="1.1" opacity="0.7"/>
      <path d="M28 28 H42 M28 34 H38" stroke="#94A3B8" stroke-width="1" opacity="0.55"/>
      <circle cx="58" cy="12" r="2.5" fill="#818CF8"/>
    </g>

    <circle class="pulse" cx="200" cy="100" r="8" fill="#13243A" stroke="#22D3EE" stroke-width="1.2"/>
    <circle class="pulse" cx="200" cy="220" r="7" fill="#13243A" stroke="#3B82F6" stroke-width="1.2"/>
    <circle class="pulse" cx="980" cy="90" r="7" fill="#13243A" stroke="#818CF8" stroke-width="1.2"/>
    <circle class="pulse" cx="980" cy="230" r="8" fill="#13243A" stroke="#22D3EE" stroke-width="1.2"/>
  </g>

  <g>
    <text class="t" x="550" y="270" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="600" letter-spacing="0.08em">REPOSITORY MESH</text>
    <text class="m" x="550" y="292" text-anchor="middle" fill="#94A3B8" font-size="10">systems | experiments | infrastructure</text>
  </g>

  <g class="m" fill="#94A3B8" font-size="8" opacity="0.45">
    <text x="40" y="30">GRAPH.VIEW</text>
    <text x="1000" y="30">MESH</text>
  </g>
</svg>
