<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-labelledby="heroTitleL heroDescL">
  <title id="heroTitleL">OPSIDIAN - Software Engineer</title>
  <desc id="heroDescL">Premium light banner with OPSIDIAN branding and a quiet distributed infrastructure diagram</desc>
  <defs>
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="textGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="nodeGradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="streakGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyanL" cx="72%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlowL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .brand { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-weight: 700; letter-spacing: 0.14em; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @media (prefers-reduced-motion: reduce) {
        .anim, .anim * { animation: none !important; }
        .packet { display: none; }
      }
      @keyframes sweep {
        0% { opacity: 0; transform: translateX(-30px); }
        35% { opacity: 0.45; }
        100% { opacity: 0; transform: translateX(50px); }
      }
      .light-sweep { animation: sweep 9s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1280" height="380" fill="url(#bgGradL)"/>
  <rect width="1280" height="380" fill="url(#glowCyanL)"/>

  <g opacity="0.12" stroke="#2563EB" stroke-width="0.5" fill="none">
    <path d="M700 200 L280 380 M700 200 L420 380 M700 200 L560 380 M700 200 L700 380 M700 200 L840 380 M700 200 L980 380 M700 200 L1120 380"/>
    <path d="M300 310 H1100 M360 340 H1040 M440 365 H960"/>
  </g>

  <g fill="#0F172A">
    <circle cx="760" cy="48" r="1.1" opacity="0.22"/>
    <circle cx="910" cy="36" r="0.9" opacity="0.16"/>
    <circle cx="1040" cy="58" r="1.2" opacity="0.20"/>
    <circle cx="1160" cy="42" r="0.8" opacity="0.15"/>
    <circle cx="1220" cy="110" r="1.0" opacity="0.18"/>
  </g>

  <g class="anim">
    <rect class="light-sweep" x="740" y="120" width="160" height="1.2" fill="url(#streakGradL)" rx="1"/>
  </g>

  <g>
    <text class="brand" x="56" y="112" font-size="58" fill="url(#textGradL)">OPSIDIAN</text>
    <text class="label" x="56" y="152" font-size="14" fill="#0891B2" letter-spacing="0.32em" font-weight="600">SOFTWARE ENGINEER</text>
    <text class="label" x="56" y="182" font-size="11" fill="#64748B" letter-spacing="0.16em">BACKEND | DISTRIBUTED SYSTEMS | CLOUD</text>
    <line x1="56" y1="204" x2="200" y2="204" stroke="#2563EB" stroke-width="1" opacity="0.35"/>
    <text class="label" x="56" y="238" font-size="15" fill="#1E293B" font-style="italic" opacity="0.92">"Designing resilient systems.</text>
    <text class="label" x="56" y="264" font-size="15" fill="#1E293B" font-style="italic" opacity="0.92">Building beyond the backend."</text>
    <g fill="#0891B2">
      <circle cx="56" cy="300" r="2.5" opacity="0.85"/>
      <circle cx="70" cy="300" r="1.8" opacity="0.45"/>
      <circle cx="82" cy="300" r="1.2" opacity="0.25"/>
    </g>
  </g>

  <g transform="translate(20,0)">
    <g fill="none" stroke="#2563EB" stroke-width="1.0" opacity="0.38">
      <path d="M760 100 C810 100, 840 128, 880 148"/>
      <path d="M760 100 C810 100, 850 72, 910 82"/>
      <path d="M880 148 C925 165, 950 180, 990 198"/>
      <path d="M910 82 C960 95, 980 145, 990 198"/>
      <path d="M990 198 C1030 218, 1055 238, 1095 252"/>
      <path d="M990 198 C1035 175, 1075 158, 1115 155"/>
      <path d="M880 148 C905 205, 930 255, 970 285"/>
      <path d="M1095 252 C1115 268, 1135 282, 1155 295"/>
      <path d="M1115 155 C1135 185, 1145 230, 1155 295"/>
    </g>

    <g class="anim" filter="url(#softGlowL)">
      <circle class="packet" r="2.6" fill="#0891B2">
        <animateMotion dur="6.5s" repeatCount="indefinite" path="M760 100 C810 100, 840 128, 880 148"/>
      </circle>
      <circle class="packet" r="2.2" fill="#6366F1">
        <animateMotion dur="7.5s" repeatCount="indefinite" begin="1.2s" path="M910 82 C960 95, 980 145, 990 198"/>
      </circle>
      <circle class="packet" r="2.3" fill="#0891B2">
        <animateMotion dur="8s" repeatCount="indefinite" begin="2.5s" path="M990 198 C1030 218, 1055 238, 1095 252"/>
      </circle>
    </g>

    <g transform="translate(720,76)">
      <rect width="78" height="48" rx="5" fill="url(#nodeGradL)" stroke="#0891B2" stroke-width="1.1"/>
      <text class="label" x="39" y="22" text-anchor="middle" fill="#0F172A" font-size="9" font-weight="600">API GATEWAY</text>
      <text class="mono" x="39" y="36" text-anchor="middle" fill="#64748B" font-size="7">edge | tls</text>
      <circle cx="70" cy="10" r="2.5" fill="#0891B2"/>
    </g>

    <g transform="translate(880,58)">
      <rect width="66" height="42" rx="5" fill="url(#nodeGradL)" stroke="#6366F1" stroke-width="1.0"/>
      <text class="label" x="33" y="19" text-anchor="middle" fill="#0F172A" font-size="9" font-weight="600">SERVICE</text>
      <text class="mono" x="33" y="32" text-anchor="middle" fill="#64748B" font-size="7">orders</text>
    </g>

    <g transform="translate(850,128)">
      <rect width="66" height="42" rx="5" fill="url(#nodeGradL)" stroke="#2563EB" stroke-width="1.0"/>
      <text class="label" x="33" y="19" text-anchor="middle" fill="#0F172A" font-size="9" font-weight="600">SERVICE</text>
      <text class="mono" x="33" y="32" text-anchor="middle" fill="#64748B" font-size="7">auth | api</text>
    </g>

    <g transform="translate(955,175)">
      <rect width="74" height="46" rx="5" fill="url(#nodeGradL)" stroke="#0891B2" stroke-width="1.1"/>
      <text class="label" x="37" y="20" text-anchor="middle" fill="#0F172A" font-size="9" font-weight="600">STREAMING</text>
      <text class="mono" x="37" y="34" text-anchor="middle" fill="#64748B" font-size="7">kafka | events</text>
    </g>

    <g transform="translate(1055,228)">
      <ellipse cx="38" cy="10" rx="36" ry="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.0"/>
      <rect x="2" y="10" width="72" height="24" fill="#EEF2FF"/>
      <line x1="2" y1="10" x2="2" y2="34" stroke="#2563EB" stroke-width="1.0"/>
      <line x1="74" y1="10" x2="74" y2="34" stroke="#2563EB" stroke-width="1.0"/>
      <ellipse cx="38" cy="34" rx="36" ry="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.0"/>
      <text class="label" x="38" y="27" text-anchor="middle" fill="#0F172A" font-size="8" font-weight="600">DATA STORE</text>
    </g>

    <g transform="translate(1080,132)">
      <rect width="72" height="44" rx="5" fill="url(#nodeGradL)" stroke="#6366F1" stroke-width="1.0"/>
      <text class="label" x="36" y="20" text-anchor="middle" fill="#0F172A" font-size="8" font-weight="600">KUBERNETES</text>
      <text class="mono" x="36" y="34" text-anchor="middle" fill="#64748B" font-size="7">cluster | pods</text>
    </g>

    <g transform="translate(1125,270)">
      <path d="M18 26 C8 26 2 20 7 15 C9 8 20 6 26 11 C31 6 44 8 46 16 C53 16 55 26 45 26 Z" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.0"/>
      <text class="label" x="28" y="24" text-anchor="middle" fill="#0F172A" font-size="8" font-weight="600">CLOUD</text>
    </g>

    <g transform="translate(935,262)">
      <rect width="68" height="42" rx="5" fill="url(#nodeGradL)" stroke="#2563EB" stroke-width="1.0"/>
      <text class="label" x="34" y="17" text-anchor="middle" fill="#0F172A" font-size="8" font-weight="600">TELEMETRY</text>
      <rect x="14" y="26" width="5" height="8" rx="1" fill="#0891B2" opacity="0.65"/>
      <rect x="23" y="23" width="5" height="11" rx="1" fill="#2563EB" opacity="0.70"/>
      <rect x="32" y="25" width="5" height="9" rx="1" fill="#6366F1" opacity="0.60"/>
      <rect x="41" y="21" width="5" height="13" rx="1" fill="#0891B2" opacity="0.75"/>
    </g>
  </g>
</svg>
