<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 120" role="img" aria-labelledby="ftTitle ftDesc">
  <title id="ftTitle">OPSIDIAN signature footer</title>
  <desc id="ftDesc">Build thoughtfully. Scale responsibly. Keep exploring.</desc>
  <defs>
    <linearGradient id="ftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="55%" stop-color="#0B1526"/>
      <stop offset="100%" stop-color="#13243A"/>
    </linearGradient>
    <linearGradient id="ftLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="45%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @media (prefers-reduced-motion: reduce) {
        .anim, .anim * { animation: none !important; }
        .packet { display: none; }
      }
    </style>
  </defs>

  <rect width="1100" height="120" rx="10" fill="url(#ftBg)"/>
  <rect x="1" y="1" width="1098" height="118" rx="9" fill="none" stroke="#1A3352" stroke-width="1"/>

  <!-- Sparse circuit traces -->
  <g fill="none" stroke="#3B82F6" stroke-width="0.9" opacity="0.28">
    <path d="M40 60 H170 Q190 60 190 42 H300"/>
    <path d="M40 60 H150 Q170 60 170 78 H260"/>
    <path d="M800 42 H900 Q920 42 920 60 H1060"/>
    <path d="M840 78 H900 Q920 78 920 60 H1060"/>
  </g>

  <!-- Sparse cyan nodes -->
  <g fill="#22D3EE">
    <circle cx="190" cy="42" r="2.5" opacity="0.75"/>
    <circle cx="170" cy="78" r="2" opacity="0.50"/>
    <circle cx="920" cy="60" r="2.5" opacity="0.70"/>
    <circle cx="300" cy="42" r="1.8" fill="#818CF8" opacity="0.45"/>
  </g>

  <g class="anim">
    <circle class="packet" r="1.8" fill="#22D3EE" opacity="0.85">
      <animateMotion dur="7s" repeatCount="indefinite" path="M40 60 H170 Q190 60 190 42 H300"/>
    </circle>
    <circle class="packet" r="1.6" fill="#818CF8" opacity="0.80">
      <animateMotion dur="8s" repeatCount="indefinite" begin="2s" path="M800 42 H900 Q920 42 920 60 H1060"/>
    </circle>
  </g>

  <line x1="240" y1="60" x2="860" y2="60" stroke="url(#ftLine)" stroke-width="1"/>

  <text class="t" x="550" y="48" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="500" font-style="italic">Build thoughtfully. Scale responsibly. Keep exploring.</text>
  <text class="m" x="550" y="88" text-anchor="middle" fill="#22D3EE" font-size="11" letter-spacing="0.35em" font-weight="600">OPSIDIAN</text>
</svg>
