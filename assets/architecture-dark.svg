<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Conceptual distributed system architecture</title>
  <desc id="archDesc">Clients to API Gateway to Backend Services to Event Streaming to Data Stores, with Containers, Kubernetes, Cloud, and Observability support layer</desc>
  <defs>
    <linearGradient id="aBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="100%" stop-color="#13243A"/>
    </linearGradient>
    <linearGradient id="aNode" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A3352"/>
      <stop offset="100%" stop-color="#0F1C2E"/>
    </linearGradient>
    <linearGradient id="aLayer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#13243A" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1A3352" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#13243A" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="aGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22D3EE" opacity="0.8"/>
    </marker>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @media (prefers-reduced-motion: reduce) {
        .anim, .anim * { animation: none !important; }
        .packet { display: none; }
      }
      @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
      .pulse { animation: pulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1100" height="420" rx="12" fill="url(#aBg)"/>
  <rect x="1" y="1" width="1098" height="418" rx="11" fill="none" stroke="#1E3A5F" stroke-width="1"/>

  <g opacity="0.08" stroke="#3B82F6" stroke-width="0.5">
    <path d="M40 60 H1060 M40 120 H1060 M40 180 H1060 M40 240 H1060 M40 300 H1060 M40 360 H1060"/>
    <path d="M100 40 V380 M200 40 V380 M300 40 V380 M400 40 V380 M500 40 V380 M600 40 V380 M700 40 V380 M800 40 V380 M900 40 V380 M1000 40 V380"/>
  </g>

  <text class="m" x="40" y="32" fill="#94A3B8" font-size="10" opacity="0.6">CONCEPTUAL - NOT A DEPLOYMENT DIAGRAM</text>

  <g class="anim" fill="none" stroke="#3B82F6" stroke-width="1.4" opacity="0.5" marker-end="url(#arrowCyan)">
    <path d="M175 130 H245"/>
    <path d="M375 130 H445"/>
    <path d="M655 130 H725"/>
    <path d="M875 130 H945"/>
  </g>

  <g class="anim" filter="url(#aGlow)">
    <circle class="packet" r="3" fill="#22D3EE">
      <animateMotion dur="3.5s" repeatCount="indefinite" path="M175 130 H245"/>
    </circle>
    <circle class="packet" r="2.5" fill="#818CF8">
      <animateMotion dur="4s" repeatCount="indefinite" begin="0.8s" path="M375 130 H445"/>
    </circle>
    <circle class="packet" r="2.5" fill="#22D3EE">
      <animateMotion dur="4.2s" repeatCount="indefinite" begin="1.5s" path="M655 130 H725"/>
    </circle>
    <circle class="packet" r="2.5" fill="#3B82F6">
      <animateMotion dur="3.8s" repeatCount="indefinite" begin="0.4s" path="M875 130 H945"/>
    </circle>
  </g>

  <g transform="translate(50,85)">
    <rect width="120" height="90" rx="8" fill="url(#aNode)" stroke="#818CF8" stroke-width="1.3"/>
    <text class="t" x="60" y="28" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="600">CLIENTS</text>
    <circle cx="40" cy="55" r="10" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
    <circle cx="60" cy="55" r="10" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
    <circle cx="80" cy="55" r="10" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
    <text class="m" x="60" y="80" text-anchor="middle" fill="#94A3B8" font-size="8">web | mobile | api</text>
  </g>

  <g transform="translate(250,85)" class="pulse">
    <rect width="120" height="90" rx="8" fill="url(#aNode)" stroke="#22D3EE" stroke-width="1.5"/>
    <text class="t" x="60" y="32" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">API GATEWAY</text>
    <text class="m" x="60" y="52" text-anchor="middle" fill="#94A3B8" font-size="8">routing | auth</text>
    <text class="m" x="60" y="68" text-anchor="middle" fill="#94A3B8" font-size="8">rate limit | tls</text>
    <circle cx="108" cy="14" r="3.5" fill="#22D3EE"/>
  </g>

  <g transform="translate(450,70)">
    <rect width="200" height="120" rx="8" fill="url(#aNode)" stroke="#3B82F6" stroke-width="1.3"/>
    <text class="t" x="100" y="24" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">BACKEND SERVICES</text>
    <rect x="14" y="40" width="52" height="36" rx="4" fill="#0F1C2E" stroke="#3B82F6" stroke-width="1"/>
    <text class="m" x="40" y="62" text-anchor="middle" fill="#F8FAFC" font-size="8">svc-a</text>
    <rect x="74" y="40" width="52" height="36" rx="4" fill="#0F1C2E" stroke="#818CF8" stroke-width="1"/>
    <text class="m" x="100" y="62" text-anchor="middle" fill="#F8FAFC" font-size="8">svc-b</text>
    <rect x="134" y="40" width="52" height="36" rx="4" fill="#0F1C2E" stroke="#22D3EE" stroke-width="1"/>
    <text class="m" x="160" y="62" text-anchor="middle" fill="#F8FAFC" font-size="8">svc-c</text>
    <text class="m" x="100" y="100" text-anchor="middle" fill="#94A3B8" font-size="8">microservices | gRPC | REST</text>
  </g>

  <g transform="translate(730,85)">
    <rect width="140" height="90" rx="8" fill="url(#aNode)" stroke="#22D3EE" stroke-width="1.3"/>
    <text class="t" x="70" y="26" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">EVENT STREAM</text>
    <text class="m" x="70" y="48" text-anchor="middle" fill="#94A3B8" font-size="8">Kafka | RabbitMQ</text>
    <text class="m" x="70" y="64" text-anchor="middle" fill="#64748B" font-size="7">(as needed)</text>
    <line x1="20" y1="76" x2="120" y2="76" stroke="#22D3EE" stroke-width="1" opacity="0.5" stroke-dasharray="4 3"/>
  </g>

  <g transform="translate(950,85)">
    <rect width="110" height="90" rx="8" fill="url(#aNode)" stroke="#818CF8" stroke-width="1.3"/>
    <text class="t" x="55" y="28" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">DATA</text>
    <ellipse cx="55" cy="52" rx="28" ry="8" fill="none" stroke="#3B82F6" stroke-width="1"/>
    <path d="M27 52 V68" stroke="#3B82F6" stroke-width="1" fill="none"/>
    <path d="M83 52 V68" stroke="#3B82F6" stroke-width="1" fill="none"/>
    <ellipse cx="55" cy="68" rx="28" ry="8" fill="none" stroke="#3B82F6" stroke-width="1"/>
    <text class="m" x="55" y="82" text-anchor="middle" fill="#94A3B8" font-size="7">db | cache</text>
  </g>

  <g transform="translate(50,250)">
    <rect width="1000" height="130" rx="10" fill="url(#aLayer)" stroke="#1E3A5F" stroke-width="1"/>
    <text class="t" x="500" y="28" text-anchor="middle" fill="#22D3EE" font-size="11" font-weight="600" letter-spacing="0.15em">INFRASTRUCTURE LAYER</text>

    <g transform="translate(60,48)">
      <rect width="180" height="60" rx="6" fill="#0F1C2E" stroke="#3B82F6" stroke-width="1.1"/>
      <text class="t" x="90" y="26" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">CONTAINERS</text>
      <text class="m" x="90" y="44" text-anchor="middle" fill="#94A3B8" font-size="8">Docker | isolation</text>
    </g>

    <g transform="translate(290,48)">
      <rect width="180" height="60" rx="6" fill="#0F1C2E" stroke="#818CF8" stroke-width="1.1"/>
      <text class="t" x="90" y="26" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">KUBERNETES</text>
      <text class="m" x="90" y="44" text-anchor="middle" fill="#94A3B8" font-size="8">orchestration | scale</text>
    </g>

    <g transform="translate(520,48)">
      <rect width="180" height="60" rx="6" fill="#0F1C2E" stroke="#22D3EE" stroke-width="1.1"/>
      <text class="t" x="90" y="26" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">CLOUD</text>
      <text class="m" x="90" y="44" text-anchor="middle" fill="#94A3B8" font-size="8">AWS | IaC | regions</text>
    </g>

    <g transform="translate(750,48)" class="pulse">
      <rect width="190" height="60" rx="6" fill="#0F1C2E" stroke="#3B82F6" stroke-width="1.1"/>
      <text class="t" x="95" y="26" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">OBSERVABILITY</text>
      <text class="m" x="95" y="44" text-anchor="middle" fill="#94A3B8" font-size="8">metrics | logs | traces</text>
    </g>
  </g>

  <g stroke="#3B82F6" stroke-width="1" opacity="0.25" stroke-dasharray="3 4">
    <line x1="310" y1="175" x2="310" y2="250"/>
    <line x1="550" y1="190" x2="550" y2="250"/>
    <line x1="800" y1="175" x2="800" y2="250"/>
  </g>
</svg>
