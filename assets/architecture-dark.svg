<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Conceptual distributed system architecture</title>
  <desc id="archDesc">Clients to API Gateway to Backend Services to Event Stream to Data, with Containers, Kubernetes, Cloud, and Observability</desc>
  <defs>
    <linearGradient id="aBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="100%" stop-color="#13243A"/>
    </linearGradient>
    <linearGradient id="aNode" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A3352"/>
      <stop offset="100%" stop-color="#13243A"/>
    </linearGradient>
    <linearGradient id="aLayer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#13243A" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1A3352" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#13243A" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="aGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L5,3 L0,6 Z" fill="#22D3EE" opacity="0.7"/>
    </marker>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @media (prefers-reduced-motion: reduce) {
        .anim, .anim * { animation: none !important; }
        .packet { display: none; }
      }
    </style>
  </defs>

  <rect width="1100" height="420" rx="12" fill="url(#aBg)"/>
  <rect x="1" y="1" width="1098" height="418" rx="11" fill="none" stroke="#1A3352" stroke-width="1"/>

  <g opacity="0.06" stroke="#3B82F6" stroke-width="0.5">
    <path d="M40 80 H1060 M40 160 H1060 M40 240 H1060 M40 320 H1060"/>
    <path d="M140 40 V380 M320 40 V380 M500 40 V380 M680 40 V380 M860 40 V380 M1040 40 V380"/>
  </g>

  <text class="m" x="40" y="34" fill="#94A3B8" font-size="10" opacity="0.55">CONCEPTUAL - NOT A DEPLOYMENT DIAGRAM</text>

  <!-- Flow connectors -->
  <g fill="none" stroke="#3B82F6" stroke-width="1.0" opacity="0.45" marker-end="url(#arrowCyan)">
    <path d="M185 145 H250"/>
    <path d="M390 145 H450"/>
    <path d="M670 145 H735"/>
    <path d="M895 145 H955"/>
  </g>

  <g class="anim" filter="url(#aGlow)">
    <circle class="packet" r="2.5" fill="#22D3EE">
      <animateMotion dur="5.5s" repeatCount="indefinite" path="M185 145 H250"/>
    </circle>
    <circle class="packet" r="2.2" fill="#818CF8">
      <animateMotion dur="6s" repeatCount="indefinite" begin="1s" path="M390 145 H450"/>
    </circle>
    <circle class="packet" r="2.3" fill="#22D3EE">
      <animateMotion dur="6.5s" repeatCount="indefinite" begin="2s" path="M670 145 H735"/>
    </circle>
  </g>

  <!-- CLIENTS -->
  <g transform="translate(55,100)">
    <rect width="125" height="90" rx="7" fill="url(#aNode)" stroke="#818CF8" stroke-width="1.0"/>
    <text class="t" x="62.5" y="30" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="600">CLIENTS</text>
    <circle cx="40" cy="55" r="9" fill="none" stroke="#94A3B8" stroke-width="1.0"/>
    <circle cx="62.5" cy="55" r="9" fill="none" stroke="#94A3B8" stroke-width="1.0"/>
    <circle cx="85" cy="55" r="9" fill="none" stroke="#94A3B8" stroke-width="1.0"/>
    <text class="m" x="62.5" y="80" text-anchor="middle" fill="#94A3B8" font-size="8">web | mobile | api</text>
  </g>

  <!-- API GATEWAY -->
  <g transform="translate(260,100)">
    <rect width="125" height="90" rx="7" fill="url(#aNode)" stroke="#22D3EE" stroke-width="1.1"/>
    <text class="t" x="62.5" y="32" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">API GATEWAY</text>
    <text class="m" x="62.5" y="54" text-anchor="middle" fill="#94A3B8" font-size="8">routing | auth</text>
    <text class="m" x="62.5" y="70" text-anchor="middle" fill="#94A3B8" font-size="8">rate limit | tls</text>
    <circle cx="112" cy="14" r="3" fill="#22D3EE"/>
  </g>

  <!-- BACKEND SERVICES -->
  <g transform="translate(460,95)">
    <rect width="200" height="100" rx="7" fill="url(#aNode)" stroke="#3B82F6" stroke-width="1.0"/>
    <text class="t" x="100" y="26" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">BACKEND SERVICES</text>
    <rect x="16" y="40" width="50" height="30" rx="4" fill="#080F1E" stroke="#3B82F6" stroke-width="0.9"/>
    <text class="m" x="41" y="59" text-anchor="middle" fill="#F8FAFC" font-size="8">svc-a</text>
    <rect x="75" y="40" width="50" height="30" rx="4" fill="#080F1E" stroke="#818CF8" stroke-width="0.9"/>
    <text class="m" x="100" y="59" text-anchor="middle" fill="#F8FAFC" font-size="8">svc-b</text>
    <rect x="134" y="40" width="50" height="30" rx="4" fill="#080F1E" stroke="#22D3EE" stroke-width="0.9"/>
    <text class="m" x="159" y="59" text-anchor="middle" fill="#F8FAFC" font-size="8">svc-c</text>
    <text class="m" x="100" y="88" text-anchor="middle" fill="#94A3B8" font-size="8">microservices | gRPC | REST</text>
  </g>

  <!-- EVENT STREAM -->
  <g transform="translate(745,100)">
    <rect width="140" height="90" rx="7" fill="url(#aNode)" stroke="#22D3EE" stroke-width="1.0"/>
    <text class="t" x="70" y="28" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">EVENT STREAM</text>
    <text class="m" x="70" y="50" text-anchor="middle" fill="#94A3B8" font-size="8">Kafka | RabbitMQ</text>
    <text class="m" x="70" y="66" text-anchor="middle" fill="#64748B" font-size="7">(as needed)</text>
    <line x1="24" y1="76" x2="116" y2="76" stroke="#22D3EE" stroke-width="0.9" opacity="0.4" stroke-dasharray="3 3"/>
  </g>

  <!-- DATA -->
  <g transform="translate(965,100)">
    <rect width="100" height="90" rx="7" fill="url(#aNode)" stroke="#818CF8" stroke-width="1.0"/>
    <text class="t" x="50" y="28" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">DATA</text>
    <ellipse cx="50" cy="52" rx="26" ry="7" fill="none" stroke="#3B82F6" stroke-width="1.0"/>
    <path d="M24 52 V66" stroke="#3B82F6" stroke-width="1.0" fill="none"/>
    <path d="M76 52 V66" stroke="#3B82F6" stroke-width="1.0" fill="none"/>
    <ellipse cx="50" cy="66" rx="26" ry="7" fill="none" stroke="#3B82F6" stroke-width="1.0"/>
    <text class="m" x="50" y="82" text-anchor="middle" fill="#94A3B8" font-size="7">db | cache</text>
  </g>

  <!-- Infrastructure layer -->
  <g transform="translate(55,250)">
    <rect width="990" height="130" rx="10" fill="url(#aLayer)" stroke="#1A3352" stroke-width="1"/>
    <text class="t" x="495" y="28" text-anchor="middle" fill="#22D3EE" font-size="11" font-weight="600" letter-spacing="0.18em">INFRASTRUCTURE LAYER</text>

    <g transform="translate(50,48)">
      <rect width="190" height="58" rx="6" fill="#080F1E" stroke="#3B82F6" stroke-width="1.0"/>
      <text class="t" x="95" y="26" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">CONTAINERS</text>
      <text class="m" x="95" y="44" text-anchor="middle" fill="#94A3B8" font-size="8">Docker | isolation</text>
    </g>

    <g transform="translate(280,48)">
      <rect width="190" height="58" rx="6" fill="#080F1E" stroke="#818CF8" stroke-width="1.0"/>
      <text class="t" x="95" y="26" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">KUBERNETES</text>
      <text class="m" x="95" y="44" text-anchor="middle" fill="#94A3B8" font-size="8">orchestration | scale</text>
    </g>

    <g transform="translate(510,48)">
      <rect width="190" height="58" rx="6" fill="#080F1E" stroke="#22D3EE" stroke-width="1.0"/>
      <text class="t" x="95" y="26" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">CLOUD</text>
      <text class="m" x="95" y="44" text-anchor="middle" fill="#94A3B8" font-size="8">AWS | IaC | regions</text>
    </g>

    <g transform="translate(740,48)">
      <rect width="200" height="58" rx="6" fill="#080F1E" stroke="#3B82F6" stroke-width="1.0"/>
      <text class="t" x="100" y="26" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">OBSERVABILITY</text>
      <text class="m" x="100" y="44" text-anchor="middle" fill="#94A3B8" font-size="8">metrics | logs | traces</text>
    </g>
  </g>

  <!-- Soft vertical links to infra -->
  <g stroke="#3B82F6" stroke-width="0.9" opacity="0.18" stroke-dasharray="3 4">
    <line x1="322" y1="190" x2="322" y2="250"/>
    <line x1="560" y1="195" x2="560" y2="250"/>
    <line x1="815" y1="190" x2="815" y2="250"/>
  </g>
</svg>
