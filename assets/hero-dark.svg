<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">OPSIDIAN - Software Engineer</title>
  <desc id="heroDesc">Premium dark banner with OPSIDIAN branding and a quiet distributed infrastructure diagram</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="60%" stop-color="#0B1526"/>
      <stop offset="100%" stop-color="#13243A"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A3352"/>
      <stop offset="100%" stop-color="#13243A"/>
    </linearGradient>
    <linearGradient id="streakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="72%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .brand { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-weight: 700; letter-spacing: 0.14em; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @media (prefers-reduced-motion: reduce) {
        .anim, .anim * { animation: none !important; }
        .packet { display: none; }
      }
      @keyframes sweep {
        0% { opacity: 0; transform: translateX(-30px); }
        35% { opacity: 0.55; }
        100% { opacity: 0; transform: translateX(50px); }
      }
      .light-sweep { animation: sweep 9s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1280" height="380" fill="url(#bgGrad)"/>
  <rect width="1280" height="380" fill="url(#glowCyan)"/>

  <!-- Quiet perspective grid -->
  <g opacity="0.10" stroke="#3B82F6" stroke-width="0.5" fill="none">
    <path d="M700 200 L280 380 M700 200 L420 380 M700 200 L560 380 M700 200 L700 380 M700 200 L840 380 M700 200 L980 380 M700 200 L1120 380"/>
    <path d="M300 310 H1100 M360 340 H1040 M440 365 H960"/>
  </g>

  <!-- Sparse stars (~5) -->
  <g fill="#F8FAFC">
    <circle cx="760" cy="48" r="1.1" opacity="0.40"/>
    <circle cx="910" cy="36" r="0.9" opacity="0.30"/>
    <circle cx="1040" cy="58" r="1.2" opacity="0.35"/>
    <circle cx="1160" cy="42" r="0.8" opacity="0.28"/>
    <circle cx="1220" cy="110" r="1.0" opacity="0.32"/>
  </g>

  <!-- Single soft light-sweep -->
  <g class="anim">
    <rect class="light-sweep" x="740" y="120" width="160" height="1.2" fill="url(#streakGrad)" rx="1"/>
  </g>

  <!-- Left typography hierarchy -->
  <g>
    <text class="brand" x="56" y="112" font-size="58" fill="url(#textGrad)">OPSIDIAN</text>
    <text class="label" x="56" y="152" font-size="14" fill="#22D3EE" letter-spacing="0.32em" font-weight="600">SOFTWARE ENGINEER</text>
    <text class="label" x="56" y="182" font-size="11" fill="#94A3B8" letter-spacing="0.16em">BACKEND | DISTRIBUTED SYSTEMS | CLOUD</text>
    <line x1="56" y1="204" x2="200" y2="204" stroke="#3B82F6" stroke-width="1" opacity="0.40"/>
    <text class="label" x="56" y="238" font-size="15" fill="#F8FAFC" font-style="italic" opacity="0.92">"Designing resilient systems.</text>
    <text class="label" x="56" y="264" font-size="15" fill="#F8FAFC" font-style="italic" opacity="0.92">Building beyond the backend."</text>
    <g fill="#22D3EE">
      <circle cx="56" cy="300" r="2.5" opacity="0.85"/>
      <circle cx="70" cy="300" r="1.8" opacity="0.45"/>
      <circle cx="82" cy="300" r="1.2" opacity="0.25"/>
    </g>
  </g>

  <!-- Right infrastructure mesh -->
  <g transform="translate(20,0)">
    <g fill="none" stroke="#3B82F6" stroke-width="1.0" opacity="0.42">
      <path id="p1" d="M760 100 C810 100, 840 128, 880 148"/>
      <path id="p2" d="M760 100 C810 100, 850 72, 910 82"/>
      <path id="p3" d="M880 148 C925 165, 950 180, 990 198"/>
      <path id="p4" d="M910 82 C960 95, 980 145, 990 198"/>
      <path id="p5" d="M990 198 C1030 218, 1055 238, 1095 252"/>
      <path id="p6" d="M990 198 C1035 175, 1075 158, 1115 155"/>
      <path id="p7" d="M880 148 C905 205, 930 255, 970 285"/>
      <path id="p8" d="M1095 252 C1115 268, 1135 282, 1155 295"/>
      <path id="p9" d="M1115 155 C1135 185, 1145 230, 1155 295"/>
    </g>

    <g class="anim" filter="url(#softGlow)">
      <circle class="packet" r="2.6" fill="#22D3EE">
        <animateMotion dur="6.5s" repeatCount="indefinite" path="M760 100 C810 100, 840 128, 880 148"/>
      </circle>
      <circle class="packet" r="2.2" fill="#818CF8">
        <animateMotion dur="7.5s" repeatCount="indefinite" begin="1.2s" path="M910 82 C960 95, 980 145, 990 198"/>
      </circle>
      <circle class="packet" r="2.3" fill="#22D3EE">
        <animateMotion dur="8s" repeatCount="indefinite" begin="2.5s" path="M990 198 C1030 218, 1055 238, 1095 252"/>
      </circle>
    </g>

    <!-- API GATEWAY -->
    <g transform="translate(720,76)">
      <rect width="78" height="48" rx="5" fill="url(#nodeGrad)" stroke="#22D3EE" stroke-width="1.1"/>
      <text class="label" x="39" y="22" text-anchor="middle" fill="#F8FAFC" font-size="9" font-weight="600">API GATEWAY</text>
      <text class="mono" x="39" y="36" text-anchor="middle" fill="#94A3B8" font-size="7">edge | tls</text>
      <circle cx="70" cy="10" r="2.5" fill="#22D3EE"/>
    </g>

    <!-- SERVICE (orders) -->
    <g transform="translate(880,58)">
      <rect width="66" height="42" rx="5" fill="url(#nodeGrad)" stroke="#818CF8" stroke-width="1.0"/>
      <text class="label" x="33" y="19" text-anchor="middle" fill="#F8FAFC" font-size="9" font-weight="600">SERVICE</text>
      <text class="mono" x="33" y="32" text-anchor="middle" fill="#94A3B8" font-size="7">orders</text>
    </g>

    <!-- SERVICE (auth) -->
    <g transform="translate(850,128)">
      <rect width="66" height="42" rx="5" fill="url(#nodeGrad)" stroke="#3B82F6" stroke-width="1.0"/>
      <text class="label" x="33" y="19" text-anchor="middle" fill="#F8FAFC" font-size="9" font-weight="600">SERVICE</text>
      <text class="mono" x="33" y="32" text-anchor="middle" fill="#94A3B8" font-size="7">auth | api</text>
    </g>

    <!-- STREAMING -->
    <g transform="translate(955,175)">
      <rect width="74" height="46" rx="5" fill="url(#nodeGrad)" stroke="#22D3EE" stroke-width="1.1"/>
      <text class="label" x="37" y="20" text-anchor="middle" fill="#F8FAFC" font-size="9" font-weight="600">STREAMING</text>
      <text class="mono" x="37" y="34" text-anchor="middle" fill="#94A3B8" font-size="7">kafka | events</text>
    </g>

    <!-- DATA STORE -->
    <g transform="translate(1055,228)">
      <ellipse cx="38" cy="10" rx="36" ry="9" fill="#1A3352" stroke="#3B82F6" stroke-width="1.0"/>
      <rect x="2" y="10" width="72" height="24" fill="#13243A"/>
      <line x1="2" y1="10" x2="2" y2="34" stroke="#3B82F6" stroke-width="1.0"/>
      <line x1="74" y1="10" x2="74" y2="34" stroke="#3B82F6" stroke-width="1.0"/>
      <ellipse cx="38" cy="34" rx="36" ry="9" fill="#1A3352" stroke="#3B82F6" stroke-width="1.0"/>
      <text class="label" x="38" y="27" text-anchor="middle" fill="#F8FAFC" font-size="8" font-weight="600">DATA STORE</text>
    </g>

    <!-- KUBERNETES -->
    <g transform="translate(1080,132)">
      <rect width="72" height="44" rx="5" fill="url(#nodeGrad)" stroke="#818CF8" stroke-width="1.0"/>
      <text class="label" x="36" y="20" text-anchor="middle" fill="#F8FAFC" font-size="8" font-weight="600">KUBERNETES</text>
      <text class="mono" x="36" y="34" text-anchor="middle" fill="#94A3B8" font-size="7">cluster | pods</text>
    </g>

    <!-- CLOUD -->
    <g transform="translate(1125,270)">
      <path d="M18 26 C8 26 2 20 7 15 C9 8 20 6 26 11 C31 6 44 8 46 16 C53 16 55 26 45 26 Z" fill="#1A3352" stroke="#22D3EE" stroke-width="1.0"/>
      <text class="label" x="28" y="24" text-anchor="middle" fill="#F8FAFC" font-size="8" font-weight="600">CLOUD</text>
    </g>

    <!-- TELEMETRY -->
    <g transform="translate(935,262)">
      <rect width="68" height="42" rx="5" fill="url(#nodeGrad)" stroke="#3B82F6" stroke-width="1.0"/>
      <text class="label" x="34" y="17" text-anchor="middle" fill="#F8FAFC" font-size="8" font-weight="600">TELEMETRY</text>
      <rect x="14" y="26" width="5" height="8" rx="1" fill="#22D3EE" opacity="0.65"/>
      <rect x="23" y="23" width="5" height="11" rx="1" fill="#3B82F6" opacity="0.70"/>
      <rect x="32" y="25" width="5" height="9" rx="1" fill="#818CF8" opacity="0.60"/>
      <rect x="41" y="21" width="5" height="13" rx="1" fill="#22D3EE" opacity="0.75"/>
    </g>
  </g>
</svg>
